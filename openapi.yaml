  /setting/third-service/:
    get:
      tags:
      - third-service
      summary: List Third-Party Services
      description: List all third-party service configurations for the current user
      operationId: list_third_services_setting_third_service__get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThirdServiceResponse'
                title: Response List Third Services Setting Third Service  Get
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
    post:
      tags:
      - third-service
      summary: Create Third-Party Service
      description: Create a new third-party service configuration
      operationId: create_third_service_setting_third_service__post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThirdServiceCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThirdServiceResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /setting/third-service/{id}:
    get:
      tags:
      - third-service
      summary: Get Third-Party Service
      description: Retrieve a third-party service configuration by ID
      operationId: get_third_service_setting_third_service__id__get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThirdServiceResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
    put:
      tags:
      - third-service
      summary: Update Third-Party Service
      description: Update a third-party service configuration
      operationId: update_third_service_setting_third_service__id__put
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThirdServiceUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThirdServiceResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
    delete:
      tags:
      - third-service
      summary: Delete Third-Party Service
      description: Soft delete a third-party service (sets is_active=False)
      operationId: delete_third_service_setting_third_service__id__delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseModel'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /setting/third-service/{id}/execute:
    post:
      tags:
      - third-service
      summary: Execute Third-Party Service
      description: Execute a third-party service with runtime variables
      operationId: execute_third_service_setting_third_service__id__execute_post
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThirdServiceExecuteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
