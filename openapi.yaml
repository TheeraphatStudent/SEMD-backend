openapi: 3.1.0
info:
  title: SEMD API
  version: 1.0.0
paths:
  /:
    get:
      summary: Root
      description: Root endpoint with API information.
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDefaultApiEndpoint'
  /health:
    get:
      summary: Health Check
      description: Health check endpoint.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDefaultHealthCheck'
  /auth/register:
    post:
      tags:
      - auth
      summary: User Registration
      description: Register a new user account with MEMBER role. Public endpoint.
      operationId: register_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/create:
    post:
      tags:
      - auth
      summary: Create Admin User
      description: Create a new ADMIN user. Requires SUPER_ADMIN role.
      operationId: create_user_auth_create_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/login:
    post:
      tags:
      - auth
      summary: User Login
      description: Authenticate user with username and password. Returns token pair
        or pre-auth token if 2FA is enabled.
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TokenPairResponse'
                - $ref: '#/components/schemas/PreAuthResponse'
                title: Response Login Auth Login Post
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/login/2fa:
    post:
      tags:
      - auth
      summary: Complete 2FA Login
      description: Complete authentication with 2FA verification code after receiving
        pre-auth token.
      operationId: login_2fa_auth_login_2fa_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFAVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/login/provider:
    post:
      tags:
      - auth
      summary: OAuth Provider Login
      description: Authenticate using OAuth provider (GitHub or Google) token.
      operationId: login_provider_auth_login_provider_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginProviderRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TokenPairResponse'
                - $ref: '#/components/schemas/PreAuthResponse'
                title: Response Login Provider Auth Login Provider Post
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh Access Token
      description: Exchange refresh token for a new token pair.
      operationId: refresh_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/logout:
    post:
      tags:
      - auth
      summary: User Logout
      description: Revoke refresh token and logout user.
      operationId: logout_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseModel'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/2fa/setup:
    post:
      tags:
      - auth
      summary: Setup 2FA
      description: Generate TOTP secret and QR code for 2FA setup. Requires authentication.
      operationId: setup_2fa_auth_2fa_setup_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFASetupResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/2fa/enable:
    post:
      tags:
      - auth
      summary: Enable 2FA
      description: Enable 2FA for the authenticated user by verifying OTP code. Requires
        authentication.
      operationId: enable_2fa_auth_2fa_enable_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFAEnableRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseModel'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/oauth/device:
    post:
      tags:
      - auth
      summary: Initiate OAuth Device Flow
      description: Start OAuth device authorization flow for GitHub. Returns device
        code and user code.
      operationId: oauth_device_initiate_auth_oauth_device_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthDeviceCodeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthDeviceCodeResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/oauth/device/poll:
    post:
      tags:
      - auth
      summary: Poll OAuth Device Flow
      description: Poll for OAuth device flow completion. Returns token pair when
        authorized or pending status.
      operationId: oauth_device_poll_auth_oauth_device_poll_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthDevicePollRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TokenPairResponse'
                - $ref: '#/components/schemas/PreAuthResponse'
                - $ref: '#/components/schemas/BaseResponseModel'
                title: Response Oauth Device Poll Auth Oauth Device Poll Post
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/oauth/authorize:
    post:
      tags:
      - auth
      summary: Get OAuth Authorization URL
      description: Generate OAuth authorization URL for GitHub or Google login.
      operationId: oauth_authorize_auth_oauth_authorize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthAuthorizationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizationResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/callback/{provider}:
    get:
      tags:
      - auth
      summary: OAuth Callback
      description: Handle OAuth callback from provider. Exchanges authorization code
        for tokens.
      operationId: oauth_callback_auth_callback__provider__get
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OAuthProviderType'
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
      - name: state
        in: query
        required: true
        schema:
          type: string
          title: State
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TokenPairResponse'
                - $ref: '#/components/schemas/PreAuthResponse'
                title: Response Oauth Callback Auth Callback  Provider  Get
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /ml/service:
    get:
      tags:
      - ml
      summary: Get Service
      operationId: get_service_ml_service_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLServiceResponse'
        '404':
          description: Not found
        '501':
          description: Not implemented
        '422':
          description: Validation error
  /prediction/predict:
    post:
      tags:
      - prediction
      summary: Predict URL
      description: Predict if a URL is malicious or not using configured service (ML
        model or third-party)
      operationId: predict_prediction_predict_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '404':
          description: Not found
        '501':
          description: Not implemented
        '422':
          description: Validation error
        '503':
          description: ML service unavailable
  /report:
    get:
      tags:
      - report
      summary: Get All Reports
      description: Get all URL reports. Requires authentication.
      operationId: get_report_data_report_get
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
    post:
      tags:
      - report
      summary: Create Report
      description: Create a new URL report. Requires authentication.
      operationId: create_report_report_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlReportCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /report/me:
    get:
      tags:
      - report
      summary: Get My Reports
      description: Get URL reports created by the current user.
      operationId: get_my_reports_report_me_get
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /report/{report_id}:
    get:
      tags:
      - report
      summary: Get Report by ID
      description: Get a specific URL report by its ID.
      operationId: get_report_by_id_report__report_id__get
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: integer
          title: Report Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
    put:
      tags:
      - report
      summary: Update Report
      description: Update an existing URL report. Requires authentication.
      operationId: update_report_report__report_id__put
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: integer
          title: Report Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlReportUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /report/{report_id}/history:
    get:
      tags:
      - report
      summary: Get Report History
      description: Get the action history of a specific URL report.
      operationId: get_report_history_report__report_id__history_get
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: integer
          title: Report Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
