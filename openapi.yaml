openapi: 3.1.0
info:
  title: SEMD API
  version: 1.0.0
paths:
  /:
    get:
      summary: Root
      description: Root endpoint with API information.
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDefaultApiEndpoint'
  /health:
    get:
      summary: Health Check
      description: Health check endpoint.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDefaultHealthCheck'
  /auth/register:
    post:
      tags:
      - auth
      summary: User Registration
      description: Register a new user account with MEMBER role. Public endpoint.
      operationId: register_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/create:
    post:
      tags:
      - auth
      summary: Create Admin User
      description: Create a new ADMIN user. Requires SUPER_ADMIN role.
      operationId: create_user_auth_create_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/login:
    post:
      tags:
      - auth
      summary: User Login
      description: Authenticate user with username and password. Returns token pair
        or pre-auth token if 2FA is enabled.
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TokenPairResponse'
                - $ref: '#/components/schemas/PreAuthResponse'
                title: Response Login Auth Login Post
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/login/2fa:
    post:
      tags:
      - auth
      summary: Complete 2FA Login
      description: Complete authentication with 2FA verification code after receiving
        pre-auth token.
      operationId: login_2fa_auth_login_2fa_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFAVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/login/provider:
    post:
      tags:
      - auth
      summary: OAuth Provider Login
      description: Authenticate using OAuth provider (GitHub or Google) token.
      operationId: login_provider_auth_login_provider_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginProviderRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TokenPairResponse'
                - $ref: '#/components/schemas/PreAuthResponse'
                title: Response Login Provider Auth Login Provider Post
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh Access Token
      description: Exchange refresh token for a new token pair.
      operationId: refresh_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/logout:
    post:
      tags:
      - auth
      summary: User Logout
      description: Revoke refresh token and logout user.
      operationId: logout_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseModel'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/2fa/setup:
    post:
      tags:
      - auth
      summary: Setup 2FA
      description: Generate TOTP secret and QR code for 2FA setup. Requires authentication.
      operationId: setup_2fa_auth_2fa_setup_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFASetupResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/2fa/enable:
    post:
      tags:
      - auth
      summary: Enable 2FA
      description: Enable 2FA for the authenticated user by verifying OTP code. Requires
        authentication.
      operationId: enable_2fa_auth_2fa_enable_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFAEnableRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseModel'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/oauth/device:
    post:
      tags:
      - auth
      summary: Initiate OAuth Device Flow
      description: Start OAuth device authorization flow for GitHub. Returns device
        code and user code.
      operationId: oauth_device_initiate_auth_oauth_device_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthDeviceCodeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthDeviceCodeResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/oauth/device/poll:
    post:
      tags:
      - auth
      summary: Poll OAuth Device Flow
      description: Poll for OAuth device flow completion. Returns token pair when
        authorized or pending status.
      operationId: oauth_device_poll_auth_oauth_device_poll_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthDevicePollRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TokenPairResponse'
                - $ref: '#/components/schemas/PreAuthResponse'
                - $ref: '#/components/schemas/BaseResponseModel'
                title: Response Oauth Device Poll Auth Oauth Device Poll Post
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/oauth/authorize:
    post:
      tags:
      - auth
      summary: Get OAuth Authorization URL
      description: Generate OAuth authorization URL for GitHub or Google login.
      operationId: oauth_authorize_auth_oauth_authorize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthAuthorizationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizationResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/callback/{provider}:
    get:
      tags:
      - auth
      summary: OAuth Callback
      description: Handle OAuth callback from provider. Exchanges authorization code
        for tokens.
      operationId: oauth_callback_auth_callback__provider__get
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OAuthProviderType'
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
      - name: state
        in: query
        required: true
        schema:
          type: string
          title: State
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TokenPairResponse'
                - $ref: '#/components/schemas/PreAuthResponse'
                title: Response Oauth Callback Auth Callback  Provider  Get
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/me:
    get:
      tags:
      - auth
      summary: Get My Profile
      description: Get current user's profile information. Requires authentication.
      operationId: get_me_auth_me_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserModel'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
    put:
      tags:
      - auth
      summary: Update My Profile
      description: Update current user's profile information. Requires authentication.
      operationId: update_me_auth_me_put
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserModel'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/me/reset-password:
    post:
      tags:
      - auth
      summary: Reset My Password
      description: Reset current user's password. Requires current password verification.
      operationId: reset_password_auth_me_reset_password_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseModel'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /auth/users:
    get:
      tags:
      - admin-users
      summary: '[Admin] Get All Users'
      description: Get all users with pagination. Admin only.
      operationId: get_all_users_auth_users_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed)
          default: 1
          title: Page
        description: Page number (1-indexed)
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Number of items per page
          default: 20
          title: Page Size
        description: Number of items per page
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Field to sort by
          title: Sort By
        description: Field to sort by
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          pattern: ^(asc|desc)$
          description: Sort order (asc or desc)
          default: desc
          title: Sort Order
        description: Sort order (asc or desc)
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
    post:
      tags:
      - admin-users
      summary: '[Admin] Create User'
      description: Create a new user with password. Admin can create MEMBER users,
        Master Admin can create ADMIN users.
      operationId: create_user_auth_users_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /auth/users/{user_id}:
    get:
      tags:
      - admin-users
      summary: '[Admin] Get User by ID'
      description: Get user details by ID. Admin only.
      operationId: get_user_by_id_auth_users__user_id__get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
    put:
      tags:
      - admin-users
      summary: '[Admin] Update User'
      description: Update user details. Master Admin can change roles, Admin cannot.
      operationId: update_user_auth_users__user_id__put
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
    delete:
      tags:
      - admin-users
      summary: '[Admin] Delete User'
      description: Delete user. Admin can delete MEMBER users, Master Admin can delete
        any user except other Master Admins.
      operationId: delete_user_auth_users__user_id__delete
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseModel'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /auth/users/{user_id}/reset-password:
    post:
      tags:
      - admin-users
      summary: '[Admin] Reset User Password'
      description: Reset user's password. Admin can reset MEMBER passwords, Master
        Admin can reset any password.
      operationId: reset_user_password_auth_users__user_id__reset_password_post
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPasswordResetRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseModel'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /ml/service:
    get:
      tags:
      - ml
      summary: Get Service
      operationId: get_service_ml_service_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLServiceResponse'
        '404':
          description: Not found
        '501':
          description: Not implemented
        '422':
          description: Validation error
  /ml/models:
    post:
      tags:
      - ml
      summary: Register Model
      description: Register a new ML model in the registry
      operationId: create_model_ml_models_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRegistryCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRegistryResponse'
        '404':
          description: Not found
        '501':
          description: Not implemented
        '422':
          description: Validation error
    get:
      tags:
      - ml
      summary: List Models
      description: List all registered ML models
      operationId: list_models_ml_models_get
      parameters:
      - name: algorithm
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by algorithm
          title: Algorithm
        description: Filter by algorithm
      - name: stage
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by stage
          title: Stage
        description: Filter by stage
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRegistryListResponse'
        '404':
          description: Not found
        '501':
          description: Not implemented
        '422':
          description: Validation error
  /ml/models/production:
    get:
      tags:
      - ml
      summary: Get Production Model
      description: Get the current production model
      operationId: get_production_model_ml_models_production_get
      parameters:
      - name: algorithm
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by algorithm
          title: Algorithm
        description: Filter by algorithm
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRegistryResponse'
        '404':
          description: Not found
        '501':
          description: Not implemented
        '422':
          description: Validation error
  /ml/models/{model_id}:
    get:
      tags:
      - ml
      summary: Get Model
      description: Get a specific model by ID
      operationId: get_model_ml_models__model_id__get
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: integer
          title: Model Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRegistryResponse'
        '404':
          description: Not found
        '501':
          description: Not implemented
        '422':
          description: Validation error
    put:
      tags:
      - ml
      summary: Update Model
      description: Update a model registry entry
      operationId: update_model_ml_models__model_id__put
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: integer
          title: Model Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRegistryUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRegistryResponse'
        '404':
          description: Not found
        '501':
          description: Not implemented
        '422':
          description: Validation error
    delete:
      tags:
      - ml
      summary: Delete Model
      description: Delete a model from the registry
      operationId: delete_model_ml_models__model_id__delete
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: integer
          title: Model Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '204':
          description: Successful Response
        '404':
          description: Not found
        '501':
          description: Not implemented
        '422':
          description: Validation error
  /ml/models/{model_id}/stage:
    patch:
      tags:
      - ml
      summary: Update Model Stage
      description: Update the stage of a model
      operationId: update_model_stage_ml_models__model_id__stage_patch
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: integer
          title: Model Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelStageUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRegistryResponse'
        '404':
