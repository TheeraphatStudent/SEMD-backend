          example: Cloudflare URL Scanner
        base_url:
          type: string
          title: Base Url
          description: Base URL with optional {{variable}} placeholders
          example: https://api.cloudflare.com/client/v4/accounts/{{account_id}}/urlscanner/v2/scan
        http_method:
          type: string
          maxLength: 8
          title: Http Method
          default: POST
        headers_json:
          additionalProperties:
            type: string
          type: object
          title: Headers Json
          description: HTTP headers including authentication (e.g., Authorization,
            API keys)
          example:
            Authorization: Bearer your_token_here
            Content-Type: application/json
        config_json:
          additionalProperties: true
          type: object
          title: Config Json
          description: Configuration for body template and URL template
          example:
            body_template:
            - input: url
              key: url
            response_mapping:
              is_malicious: result.malicious
            url_template:
              path_params:
                account_id: your_account_id
              query_params:
                url: url
        mapping_json:
          additionalProperties: true
          type: object
          title: Mapping Json
          description: Response mapping configuration for extracting prediction data
          example:
            class: data.category
            is_malicious: data.is_malicious
            suggested_desc: data.description
      type: object
      required:
      - service_name
      - base_url
      title: ThirdServiceCreateRequest
