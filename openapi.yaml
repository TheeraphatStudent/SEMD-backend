components:
  schemas:
    ACLType:
      type: string
      enum:
      - GLOBAL
      - PRIVATE
      title: ACLType
    AccessKeyAdminCreateRequest:
      properties:
        user_id:
          type: integer
          title: User Id
          description: User ID to create key for
        key_name:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Key Name
          description: Name for the access key
        usage_limit:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Usage Limit
          description: Usage limit for the key (null = unlimited)
        expired_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expired At
          description: Expiration date for the key
      type: object
      required:
      - user_id
      title: AccessKeyAdminCreateRequest
    AccessKeyAdminUpdateRequest:
      properties:
        key_name:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Key Name
          description: Name for the access key
        usage_limit:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Usage Limit
          description: Usage limit for the key (null = unlimited)
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
          description: Whether the key is active
        expired_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expired At
          description: Expiration date for the key
      type: object
      title: AccessKeyAdminUpdateRequest
    AccessKeyCreateRequest:
      properties:
        key_name:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Key Name
          description: Name for the access key
        expired_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expired At
          description: Expiration date for the key
      type: object
      title: AccessKeyCreateRequest
    AccessKeyListResponse:
      properties:
        status:
          type: integer
          title: status
          description: Response status code
          examples:
          - 200
          - 404
          - 500
        message:
          type: string
          title: message
          description: Response message
          examples:
          - Success
          - Not found
          - Internal server error
        data:
          items: {}
          type: array
          title: data
          description: List of Access Keys
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
          title: pagination
          description: Pagination metadata
      type: object
      required:
      - status
      - message
      - data
      - pagination
      title: AccessKeyListResponse
    AccessKeyResponse:
      properties:
        status:
          type: integer
          title: status
          description: Response status code
          examples:
          - 200
          - 404
          - 500
        message:
          type: string
          title: message
          description: Response message
          examples:
          - Success
          - Not found
          - Internal server error
        data:
          title: data
          description: Access Key data
      type: object
      required:
      - status
      - message
      - data
      title: AccessKeyResponse
    ApiEndpointStatItem:
      properties:
        endpoint:
          type: string
          title: Endpoint
          description: API endpoint path
        method:
          type: string
          title: Method
          description: HTTP method
        request_count:
          type: integer
          title: Request Count
          description: Number of requests
        avg_response_time:
          type: number
          title: Avg Response Time
          description: Average response time in ms
        error_rate:
          type: number
          title: Error Rate
          description: Error rate percentage
      type: object
      required:
      - endpoint
      - method
      - request_count
      - avg_response_time
      - error_rate
      title: ApiEndpointStatItem
    ApiEndpointStatResponse:
      properties:
        status:
          type: integer
          title: status
          description: Response status code
          examples:
          - 200
          - 404
          - 500
        message:
          type: string
          title: message
          description: Response message
          examples:
          - Success
          - Not found
          - Internal server error
        data:
          items:
            $ref: '#/components/schemas/ApiEndpointStatItem'
