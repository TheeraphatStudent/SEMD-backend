components:
  schemas:
    ACLType:
      type: string
      enum:
      - GLOBAL
      - PRIVATE
      title: ACLType
    AccessKeyAdminCreateRequest:
      properties:
        user_id:
          type: integer
          title: User Id
          description: User ID to create key for
        key_name:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Key Name
          description: Name for the access key
        usage_limit:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Usage Limit
          description: Usage limit for the key (null = unlimited)
        expired_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expired At
          description: Expiration date for the key
      type: object
      required:
      - user_id
      title: AccessKeyAdminCreateRequest
    AccessKeyAdminUpdateRequest:
      properties:
        key_name:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Key Name
          description: Name for the access key
        usage_limit:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Usage Limit
          description: Usage limit for the key (null = unlimited)
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
          description: Whether the key is active
        expired_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expired At
          description: Expiration date for the key
      type: object
      title: AccessKeyAdminUpdateRequest
    AccessKeyCreateRequest:
      properties:
        key_name:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Key Name
          description: Name for the access key
        expired_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expired At
          description: Expiration date for the key
      type: object
      title: AccessKeyCreateRequest
    AccessKeyListResponse:
      properties:
        status:
          type: integer
          title: status
          description: Response status code
          examples:
          - 200
          - 404
          - 500
        message:
          type: string
          title: message
          description: Response message
          examples:
          - Success
          - Not found
          - Internal server error
        data:
          items: {}
          type: array
          title: data
          description: List of Access Keys
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
          title: pagination
          description: Pagination metadata
      type: object
      required:
      - status
      - message
      - data
      - pagination
      title: AccessKeyListResponse
    AccessKeyResponse:
      properties:
        status:
          type: integer
          title: status
          description: Response status code
          examples:
          - 200
          - 404
          - 500
        message:
          type: string
          title: message
          description: Response message
          examples:
          - Success
          - Not found
          - Internal server error
        data:
          title: data
          description: Access Key data
      type: object
      required:
      - status
      - message
      - data
      title: AccessKeyResponse
    AdminCreateUserRequest:
      properties:
        username:
          type: string
          maxLength: 32
          minLength: 3
          title: Username
          description: Username
        email:
          type: string
          format: email
          title: Email
          description: Email address
        full_name:
          type: string
          maxLength: 512
          minLength: 1
          title: Full Name
          description: Full name
        password:
          type: string
          minLength: 8
          title: Password
          description: Password
        role:
          $ref: '#/components/schemas/RoleType'
          description: User role
          default: MEMBER
        birthday:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Birthday
          description: Birthday
        profile_img_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile Img Uri
          description: Profile image URI
      type: object
      required:
      - username
      - email
      - full_name
      - password
      title: AdminCreateUserRequest
    AdminPasswordResetRequest:
      properties:
        new_password:
          type: string
          minLength: 8
          title: New Password
          description: New password
        confirm_password:
          type: string
          minLength: 8
          title: Confirm Password
          description: Confirm new password
      type: object
      required:
      - new_password
      - confirm_password
      title: AdminPasswordResetRequest
    AdminUpdateUserRequest:
      properties:
        username:
          anyOf:
          - type: string
            maxLength: 32
            minLength: 3
          - type: 'null'
          title: Username
          description: Username
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
          description: Email address
        full_name:
          anyOf:
          - type: string
            maxLength: 512
            minLength: 1
          - type: 'null'
          title: Full Name
          description: Full name
        birthday:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Birthday
