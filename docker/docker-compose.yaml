  #     context: ..
  #     dockerfile: docker/backend.Dockerfile
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     MLFLOW_TRACKING_URI: http://127.0.0.1:5000
  #     REDIS_HOST: ${REDIS_HOST:-redis}
  #     REDIS_PORT: ${REDIS_PORT:-6379}
  #     REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  #     REDIS_DB: ${REDIS_DB:-0}
  #     POSTGRES_HOST: ${POSTGRES_HOST:-postgreSQL}
  #   depends_on:
  #     - postgreSQL
  #     - redis
  #   networks:
  #     - semd-shared-network

volumes:
  semd_postgresql_data:
  semd_redis_data:

networks:
  semd-shared-network:
    name: semd-shared-network
    driver: bridge
    external: false
