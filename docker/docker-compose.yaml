services:
  postgreSQL:
    image: docker.io/library/postgres:17
    restart: always
    container_name: semd-database
    env_file:
      - ./postgres.env
    volumes:
      - semd_postgresql_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - semd-shared-network

  redis:
    container_name: semd-redis
    build:
      context: ..
      dockerfile: docker/redis.Dockerfile
    volumes:
      - semd_redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - semd-shared-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # backend:
