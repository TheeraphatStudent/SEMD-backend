[project]
name = "semd-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "configparser>=7.2.0",
    "fastapi[standard]>=0.126.0",
    "mlflow>=3.7.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pyformat>=1.0",
    "pyjwt>=2.8.0",
    "pyotp>=2.9.0",
    "python-dotenv>=1.2.1",
    "python-jose>=3.3.0",
    "python-multipart>=0.0.6",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.47",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Baseline only: catch real errors and unused imports, don't impose a style
# rewrite on ~150 pre-existing files in one pass. Widen selection incrementally
# per-feature during Phase 4, per SEMD_BACKEND_REFACTOR_ROADMAP.md.
select = ["E", "F", "I"]
ignore = ["E501"]  # line length not enforced yet; formatter not adopted

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
# Lenient baseline: enforcement tightens per-feature during Phase 4, not globally
# up front, per SEMD_BACKEND_REFACTOR_ROADMAP.md Phase 3 typing item.
disable_error_code = ["import-untyped"]
